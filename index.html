<script>

  const firebaseConfig = {
    apiKey: "AIzaSyCTjE53vhBz9sQrD_6e_6t0fQjkQciwvZU",
    authDomain: "ponte-hub.firebaseapp.com",
    projectId: "ponte-hub",
    storageBucket: "ponte-hub.firebasestorage.app",
    messagingSenderId: "591701694553",
    appId: "1:591701694553:web:92f941ca92c7c19ed3b948",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const PONTE_HUB_SENHA_MESTRE = "17022506";
  const PONTE_HUB_SESSAO_KEY = "ponte-hub-sessao";
  const PONTE_HUB_STORAGE_DOC = "ponte-hub-data";

  window.ponteAuth = {
    async login(codigo) {
      const codigoLimpo = (codigo || "").trim();
      if (codigoLimpo === PONTE_HUB_SENHA_MESTRE) {
        const sessao = { tipo: "master", area: "adm", nome: "Administrador" };
        localStorage.setItem(PONTE_HUB_SESSAO_KEY, JSON.stringify(sessao));
        return sessao;
      }
      try {
        const snap = await db.collection("storage").doc(PONTE_HUB_STORAGE_DOC).get();
        const data = snap.exists ? JSON.parse(snap.data().value) : {};
        const vendedores = data.vendedores || [];
        const v = vendedores.find((v) => (v.codigoAcesso || "").toUpperCase() === codigoLimpo.toUpperCase() && codigoLimpo !== "");
        if (v) {
          const sessao = { tipo: "vendedor", area: "vendas", nome: v.nome, vendedorId: v.id };
          localStorage.setItem(PONTE_HUB_SESSAO_KEY, JSON.stringify(sessao));
          return sessao;
        }
      } catch (e) {
        console.error("Ponte Hub — erro ao validar código de acesso:", e);
      }
      return null;
    },
    logout() {
      localStorage.removeItem(PONTE_HUB_SESSAO_KEY);
    },
    getSessao() {
      try {
        const raw = localStorage.getItem(PONTE_HUB_SESSAO_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    },
  };

  window.storage = {
    async get(key, shared) {
      const snap = await db.collection("storage").doc(key).get();
      if (!snap.exists) throw new Error("not found");
      return { key, value: snap.data().value, shared: !!shared };
    },
    async set(key, value, shared) {
      // Antes de sobrescrever, guarda uma cópia do que estava lá (1 por dia) — proteção
      // contra qualquer bug futuro que tente salvar um estado vazio/errado por cima do real.
      try {
        const atual = await db.collection("storage").doc(key).get();
        if (atual.exists) {
          const hoje = new Date().toISOString().slice(0, 10);
          await db.collection("storage_backups").doc(`${key}__${hoje}`).set({
            value: atual.data().value,
            backupDe: hoje,
            criadoEm: new Date().toISOString(),
          });
        }
      } catch (e) {
        console.error("Ponte Hub — falha ao gravar backup diário (não impede o salvamento):", e);
      }
      await db.collection("storage").doc(key).set({ value });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      await db.collection("storage").doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const snap = await db.collection("storage").get();
      const keys = snap.docs.map((d) => d.id).filter((k) => k.startsWith(prefix || ""));
      return { keys, prefix, shared: !!shared };
    },
  };

  window.buscarClientesCompartilhados = async function() {
    const snap = await db.collection("clientes").get();
    return snap.docs.map((d) => ({ docId: d.id, ...d.data() }));
  };

  window.salvarClienteCompartilhado = async function(c) {
    const payload = {
      cnpj: c.cnpj || "",
      codigo: c.codigo || "",
      contato: c.contato || "",
      endereco: c.endereco || "",
      nome: c.nome || "",
    };
    if (c.docId) {
      await db.collection("clientes").doc(c.docId).set(payload, { merge: true });
      return c.docId;
    } else {
      const ref = await db.collection("clientes").add({ ...payload, id: Date.now() });
      return ref.id;
    }
  };

  // Cadastro público de clientes — coleção separada (não mexe no documento
  // principal do Hub), alimentada pelo link https://.../?cadastro=1 e revisada
  // pelo ADM em Clientes → "Cadastros recebidos pelo link público" antes de
  // entrar na lista oficial.
  window.enviarCadastroPublico = async function(dados) {
    await db.collection("cadastros_publicos").add({
      ...dados,
      status: "pendente",
      criadoEm: Date.now(),
    });
  };

  window.buscarCadastrosPublicos = async function() {
    const snap = await db.collection("cadastros_publicos").get();
    return snap.docs.map((d) => ({ docId: d.id, ...d.data() }));
  };

  window.removerCadastroPublico = async function(docId) {
    if (!docId) return;
    await db.collection("cadastros_publicos").doc(docId).delete();
  };

  const CLOUDINARY_CLOUD = "fsilapsf";
  const CLOUDINARY_PRESET = "ponte-hub-produtos";

  window.uploadFoto = async function(file) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_PRESET);
    formData.append("folder", "ponte-hub/produtos");
    const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: "POST",
      body: formData,
    });
    if (!resp.ok) throw new Error("Falha no upload para o Cloudinary");
    const data = await resp.json();
    return data.secure_url;
  };

  window.uploadArquivo = async function(file) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_PRESET);
    formData.append("folder", "ponte-hub/anexos");
    const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, {
      method: "POST",
      body: formData,
    });
    if (!resp.ok) throw new Error("Falha no upload para o Cloudinary");
    const data = await resp.json();
    return data.secure_url;
  };

</script>
