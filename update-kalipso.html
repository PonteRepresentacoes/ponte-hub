function normCA(v){ return String(v||'').replace(/[\s.\-]/g,'').trim(); }
function log(cls,msg){ const el=document.getElementById('log'); el.style.display='block'; el.innerHTML+=`<span class="${cls}">${msg}</span>\n`; el.scrollTop=el.scrollHeight; }

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const btnLogin = document.getElementById('btn-login');
const btnRun   = document.getElementById('btn-run');
const status   = document.getElementById('status');

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('user-info').style.display = 'block';
    document.getElementById('user-info').textContent = `✓ Logado como ${user.email}`;
    btnLogin.style.display = 'none';
    btnRun.disabled = false;
    status.textContent = 'Pronto. Clique em Atualizar para processar os produtos.';
  } else {
    btnLogin.style.display = 'inline-flex';
    btnRun.disabled = true;
    status.textContent = 'Faça login para continuar.';
  }
});

btnLogin.onclick = async () => {
  try {
    btnLogin.disabled = true;
    status.textContent = 'Abrindo janela de login…';
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) {
    status.textContent = 'Erro no login: ' + e.message;
    btnLogin.disabled = false;
  }
};

btnRun.onclick = async () => {
  btnRun.disabled = true;
  status.textContent = 'Lendo produtos do Firestore…';
  document.getElementById('progress-wrap').style.display = 'block';

  try {
    const snap = await getDocs(collection(db, 'produtos'));
    const total = snap.size;
    status.textContent = `${total} produtos lidos. Processando…`;
    log('info', `Total de produtos: ${total}`);

    const toUpdate = [], skipped = [], noMatch = [];

    snap.forEach(d => {
      const p = d.data();
      const ca = normCA(p.ca || p.certificado || '');
      if (ca && CA_MAP[ca]) {
        if (p.fotoUrl && p.fotoUrl.includes('kalipso')) {
          skipped.push({nome: p.nome, ca});
        } else {
          toUpdate.push({id: d.id, url: CA_MAP[ca].url, nome: p.nome || CA_MAP[ca].nome, ca});
        }
      } else {
        noMatch.push(p.nome || d.id);
      }
    });

    log('info', `A atualizar: ${toUpdate.length} | Já OK: ${skipped.length} | Sem CA mapeado: ${noMatch.length}`);

    // Batch update (max 500/batch)
    let done = 0;
    const batchSize = 400;
    for (let i = 0; i < toUpdate.length; i += batchSize) {
      const chunk = toUpdate.slice(i, i + batchSize);
      const batch = writeBatch(db);
      chunk.forEach(({id, url}) => batch.update(doc(db,'produtos',id), {fotoUrl: url}));
      await batch.commit();
      done += chunk.length;
      const pct = Math.round((done / toUpdate.length) * 100);
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('progress-label').textContent = `${done} / ${toUpdate.length}`;
      chunk.forEach(({nome, ca, url}) => log('ok', `✓ ${nome} (CA ${ca}) → ${url.split('/').pop()}`));
    }

    skipped.forEach(({nome, ca}) => log('warn', `↷ ${nome} (CA ${ca}) — já tinha foto`));

    // Show results
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('r-match').textContent = toUpdate.length;
    document.getElementById('r-skip').textContent = skipped.length;
    document.getElementById('r-no').textContent = noMatch.length;
    document.getElementById('r-msg').textContent = `Concluído! ${toUpdate.length} produtos receberam fotoUrl Kalipso do GitHub/Vercel.`;
    status.textContent = '✅ Atualização concluída!';
    document.getElementById('bar').style.width = '100%';

  } catch(e) {
    status.textContent = '❌ Erro: ' + e.message;
    log('err', 'Erro: ' + e.message);
    btnRun.disabled = false;
  }
};
