  if (!window.storage) {
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem("ponte-hub:" + key);
        if (raw === null) throw new Error("not found");
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem("ponte-hub:" + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem("ponte-hub:" + key);
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith("ponte-hub:" + (prefix || "")))
          .map((k) => k.replace("ponte-hub:", ""));
        return { keys, prefix, shared: !!shared };
      },
    };
  }

<script>
const {
  useState,
  useEffect,
  useRef
} = React;

// ---------- Brand tokens ----------
const NAVY = "#0B1220";
const NAVY_SOFT = "#111C34";

const VENDOR_COLORS = [{
  key: "blue",

}, {
  key: "emerald",

}, {

const pickField = (row, keys) => {
  const rowKeys = Object.keys(row);
  for (const wanted of keys) {
    const found = rowKeys.find(k => norm(k) === norm(wanted));
    if (found) return row[found];
  }
  return undefined;
};
const uid = () => Math.random().toString(36).slice(2, 10);

// Depois de publicar o backend na Vercel (ver /backend/README-deploy-sintegra.md),

const STORAGE_KEY = "ponte-hub-data";
function PonteHub() {
  const [area, setArea] = useState("adm"); // "adm" | "vendas"
  const [tab, setTab] = useState("dashboard");
  const changeArea = a => {

  const [vendedores, setVendedores] = useState([]);

  const [pedidosEspelho, setPedidosEspelho] = useState([]);
  const [tabelaICMS, setTabelaICMS] = useState([]);
  const [produtos, setProdutos] = useState([]);
  const [condicoesPagamentoCadastro, setCondicoesPagamentoCadastro] = useState([]);
  const [representadasCadastro, setRepresentadasCadastro] = useState([]);
  const [transportadorasCadastro, setTransportadorasCadastro] = useState([]);
  const [taxaImposto, setTaxaImposto] = useState(15.5);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error

  // ---------- Load once ----------

function downloadCSV(filename, header, rows) {
  const body = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
  const blob = new Blob([header + "\n" + body], {
    type: "text/csv;charset=utf-8;"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function RelatoriosClientes({

    downloadCSV("clientes-dados-cadastrais.csv", "Nome,CNPJ,Razão Social,Cidade,UF,Telefone,IE", rows);
  };
  const vendaPorClienteABC = () => {
    const porCliente = {};
    ativos.forEach(p => {
      porCliente[p.clienteNome] = (porCliente[p.clienteNome] || 0) + p.total;
    });
    const lista = Object.entries(porCliente).map(([nome, valor]) => ({
      nome,
      valor
    })).sort((a, b) => b.valor - a.valor);
    const totalGeral = lista.reduce((a, i) => a + i.valor, 0);
    const classificado = classificarABC(lista, totalGeral);
    const rows = classificado.map(i => [i.nome, brl(i.valor), `${i.pctAcumulado.toFixed(1)}%`, i.classe]);
    downloadCSV("venda-por-cliente-curva-abc.csv", "Cliente,Total Vendido,% Acumulado,Classe", rows);
  };
  const clientesInativos = () => {
    const comPedido = new Set(ativos.map(p => p.clienteId).filter(Boolean));
    const rows = clientes.filter(c => !comPedido.has(c.id)).map(c => [c.nome, c.cnpj || "", c.cidade || c.municipio || "", c.estado || ""]);
    downloadCSV("clientes-inativos.csv", "Cliente,CNPJ,Cidade,UF", rows);
  };
  const clientesPositivados = () => {
    const positivados = new Set(ativos.map(p => p.clienteId).filter(Boolean));
    const rows = clientes.map(c => [c.nome, positivados.has(c.id) ? "Sim" : "Não"]);
    downloadCSV("clientes-positivados.csv", "Cliente,Positivado", rows);
  };
  const itens = [{
    label: "Dados cadastrais",
    fn: dadosCadastrais
  }, {
    label: "Venda por cliente — Curva ABC",
    fn: vendaPorClienteABC
  }, {
    label: "Clientes inativos",
    fn: clientesInativos
  }, {
    label: "Clientes positivados",
