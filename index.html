<script>

  if (!window.storage) {
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem("ponte-hub:" + key);
        if (raw === null) throw new Error("not found");
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem("ponte-hub:" + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem("ponte-hub:" + key);
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith("ponte-hub:" + (prefix || "")))
          .map((k) => k.replace("ponte-hub:", ""));
        return { keys, prefix, shared: !!shared };
      },
    };
  }

<script>
const {
  useState,
  useEffect,
  useRef
} = React;

// ---------- Brand tokens ----------
const NAVY = "#0B1220";
const NAVY_SOFT = "#111C34";
const ROYAL = "#1D4ED8";
const ROYAL_DEEP = "#1E3A8A";
const PAPER = "#F4F6FA";
const LINE = "#E2E8F0";
const VENDOR_COLORS = [{
  key: "blue",
  label: "Azul",
  chip: "bg-blue-50 text-blue-800 border-blue-400",
  dot: "bg-blue-500"
}, {
  key: "emerald",
  label: "Verde",
  chip: "bg-emerald-50 text-emerald-800 border-emerald-400",
  dot: "bg-emerald-500"
}, {
  key: "amber",
  label: "Âmbar",
  chip: "bg-amber-50 text-amber-800 border-amber-400",
  dot: "bg-amber-500"
}, {
  key: "violet",
  label: "Violeta",
  chip: "bg-violet-50 text-violet-800 border-violet-400",
  dot: "bg-violet-500"
}, {
  key: "rose",
  label: "Rosa",
  chip: "bg-rose-50 text-rose-800 border-rose-400",
  dot: "bg-rose-500"
}, {
  key: "cyan",
  label: "Ciano",
  chip: "bg-cyan-50 text-cyan-800 border-cyan-400",
  dot: "bg-cyan-500"
}];
const colorMeta = key => VENDOR_COLORS.find(c => c.key === key) || VENDOR_COLORS[0];
const brl = n => (isFinite(n) ? n : 0).toLocaleString("pt-BR", {
  style: "currency",
  currency: "BRL"
});
const norm = s => (s || "").toString().trim().toLowerCase();
const pickField = (row, keys) => {
  const rowKeys = Object.keys(row);
  for (const wanted of keys) {
    const found = rowKeys.find(k => norm(k) === norm(wanted));
    if (found) return row[found];
  }
  return undefined;
};
const uid = () => Math.random().toString(36).slice(2, 10);

// Depois de publicar o backend na Vercel (ver /backend/README-deploy-sintegra.md),
// troque pela URL real, ex: "https://seu-projeto.vercel.app/api/sintegra"
// Deixe em branco para pular essa busca (IE/regime ficam manuais até então).
const SINTEGRA_ENDPOINT = "/api/sintegra";
const STORAGE_KEY = "ponte-hub-data";
function PonteHub() {
  const [area, setArea] = useState("adm"); // "adm" | "vendas"
  const [tab, setTab] = useState("dashboard");
  const changeArea = a => {
    setArea(a);
    setTab(a === "adm" ? "dashboard" : "vendas-home");
  };
  const [vendedores, setVendedores] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [lancamentos, setLancamentos] = useState([]);
  const [fluxoCaixa, setFluxoCaixa] = useState([]);
  const [oportunidades, setOportunidades] = useState([]);
  const [produtosGiro, setProdutosGiro] = useState([]);
  const [analisesPreditivas, setAnalisesPreditivas] = useState([]);
  const [chamadosLRA, setChamadosLRA] = useState([]);
  const [pedidosEspelho, setPedidosEspelho] = useState([]);
  const [tabelaICMS, setTabelaICMS] = useState([]);
  const [taxaImposto, setTaxaImposto] = useState(15.5);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error

  // ---------- Load once ----------
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          setVendedores(data.vendedores || []);
          setClientes(data.clientes || []);
          setLancamentos(data.lancamentos || []);
          setFluxoCaixa(data.fluxoCaixa || []);
          setOportunidades(data.oportunidades || []);
          setProdutosGiro(data.produtosGiro || []);
          setAnalisesPreditivas(data.analisesPreditivas || []);
          setChamadosLRA(data.chamadosLRA || []);
          setPedidosEspelho(data.pedidosEspelho || []);
          setTabelaICMS(data.tabelaICMS || []);
          setTaxaImposto(typeof data.taxaImposto === "number" ? data.taxaImposto : 15.5);
        }
      } catch (e) {
        // no data yet — fine, start empty
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  // ---------- Persist on change ----------
  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(async () => {
      setSaveState("saving");
      try {
        const payload = JSON.stringify({
          vendedores,
          clientes,
          lancamentos,
          fluxoCaixa,
          oportunidades,
          produtosGiro,
          analisesPreditivas,
          chamadosLRA,
          pedidosEspelho,
          tabelaICMS,
          taxaImposto
        });
        const ok = await window.storage.set(STORAGE_KEY, payload, false);
        setSaveState(ok ? "saved" : "error");
      } catch (e) {
        setSaveState("error");
      }
    }, 400);
    return () => clearTimeout(t);
  }, [vendedores, clientes, lancamentos, fluxoCaixa, oportunidades, produtosGiro, analisesPreditivas, chamadosLRA, pedidosEspelho, tabelaICMS, taxaImposto, loaded]);

  // ---------- Derived totals ----------
  const totalBruto = lancamentos.reduce((a, l) => a + l.valorBruto, 0);
  const totalImposto = lancamentos.reduce((a, l) => a + l.imposto, 0);
  const totalRepasse = lancamentos.reduce((a, l) => a + l.repasse, 0);
  const totalPonte = lancamentos.reduce((a, l) => a + l.ficaComPonte, 0);
  const saldoEmpresa = fluxoCaixa.reduce((a, f) => {
    if (f.tag === "empresa") return a + f.valor;
    if (f.tag === "misto") return a + f.valor * ((f.percentualEmpresa ?? 50) / 100);
    return a;
  }, 0);
  const saldoPessoal = fluxoCaixa.reduce((a, f) => {
    if (f.tag === "pessoal") return a + f.valor;
    if (f.tag === "misto") return a + f.valor * (1 - (f.percentualEmpresa ?? 50) / 100);
    return a;
  }, 0);
  const findVendedorByCliente = nomeCliente => {
    const c = clientes.find(c => norm(c.nome) === norm(nomeCliente));
